<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search for Members - R.A.I.D.</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #000;
      color: #fff;
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .logo {
      margin-top: 50px;
    }
    .search-box {
      margin: 40px auto;
      max-width: 300px;
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 5px;
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
      border: none;
      border-radius: 3px;
    }
    button {
      padding: 10px 15px;
      background-color: #FFD43B;
      border: none;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #ffcc00;
    }
    a {
      display: inline-block;
      margin-top: 30px;
      color: #FFD43B;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="raid-logo.PNG" alt="R.A.I.D. Logo" width="150">
  </div>

  <h1>Search for Members</h1>

  <div class="search-box">
    <input type="text" placeholder="Type name or ID here...">
    <button>Search</button>
  </div>

  <a href="index.html">← Back to Home</a>
</body>
</html>
